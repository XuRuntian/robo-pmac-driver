[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_continuum"
version = "0.1.0"
description = "LeRobot plugin for the PMAC continuum robot driver service"
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.5.2",
    "pyzmq>=26.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
