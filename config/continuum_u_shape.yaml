geometry:
  s_s: 0.002
  s_a: 0.048
  s_c: 0.024
  h_bc: 0.0064
  h_de: 0.009
  theta_a_max_rad: 3.141592653589793
  theta_c_max_rad: 1.5707963267948966
  d_min_m: 0.0
  d_max_m: 0.255
  base_offset_m: [0.0, 0.4402, 0.207]
  use_sheath: false

ik:
  # The driver also forces pos_z when orientation_enabled is true. Keeping this
  # explicit makes the experiment self-documenting.
  task_mode: pos_z
  lambda_damping: 0.008
  alpha: 1.0
  pos_tol_m: 0.0002
  dir_tol: 0.001
  ori_tol_rad: 0.0005
  max_inner_steps: 8
  jacobian_eps: [0.001, 0.005, 0.005, 0.005, 0.005]
  position_weight: 1.0
  # Stronger than the stable baseline so Omega rotation visibly affects the
  # proximal/distal shape instead of being dominated by tip-position tracking.
  direction_weight: 0.8
  orientation_weight: 0.1
  line_search_steps: 4
  gradient_fallback_step: 0.01
  step_limit_enabled: false
  max_delta_u: [0.0003, 0.0025, 0.0025, 0.0025, 0.0025]

actuation:
  hole_radius_m: 0.003
  spool_diameter_m: 0.012

control:
  update_hz: 50
  pvt_velocity_from_diff: true
