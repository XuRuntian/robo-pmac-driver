# Omega raw-device -> standard WORLD command mapping.
# `map: zxy` means WORLD X <- raw Z, WORLD Y <- raw X, WORLD Z <- raw Y.
# Signs are applied after reordering, on WORLD X/Y/Z. Gains are per WORLD axis.
translation:
  map: yxz
  signs: [1, -1, 1]
  gain: [0.5, 0.5, 0.5]

rotation:
  map: yxz
  signs: [1, -1, 1]
  gain: [1.0, 0.0, 1.0]

# Rotation input x/y/z slots are wrist joint deltas dq1/dq2/dq3 (rad).
# Experimental joint control: dq2 -> Rx, dq3 -> Rz; dq1 -> -Ry is disabled.
# This is not a geometric WORLD-axis correspondence or full pose tracking.
