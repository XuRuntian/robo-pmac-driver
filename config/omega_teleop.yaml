# Omega raw-device -> standard WORLD command mapping.
# `map: zxy` means WORLD X <- raw Z, WORLD Y <- raw X, WORLD Z <- raw Y.
# Signs are applied after reordering, on WORLD X/Y/Z. Gains are per WORLD axis.
translation:
  map: yxz
  signs: [1, -1, 1]
  gain: [0.5, 0.5, 0.5]

rotation:
  map: zyx
  signs: [-1, 1, 1]
  gain: [1.0, 0.0, 1.0]

# rx->rz
# ry -> 空
# rz ->rx