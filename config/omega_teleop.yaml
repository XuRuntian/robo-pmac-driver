# Omega raw-device -> standard WORLD command mapping.
# `map: zxy` means WORLD X <- raw Z, WORLD Y <- raw X, WORLD Z <- raw Y.
# Signs are applied after reordering, on WORLD X/Y/Z. Gains are per WORLD axis.
translation:
  map: yxz
  signs: [1, -1, 1]
  gain: [0.5, 0.5, 0.5]

rotation:
  map: yxz
  signs: [1, -1, 1]
  gain: [1.0, 0.0, 1.0]

# Omega WORLD Ry -> robot WORLD Rx; Rz -> Rz.
# Omega WORLD Rx -> robot WORLD -Ry, disabled by the output Y gain.
