# Experimental U-shape / tip-direction interface config.
# This intentionally allows larger rx/ry than the stable rotation config.
# Tested with LeRobot omega_continuum rotation scale [-0.3, 0.3, 0.0].
control_hz: 50

omega_map: zxy

initial_position:
  mode: capture_current
  reference_pulses: [63037980, 503187440, -141762994, 404354914, 18]
  reject_all_zero_feedback: true
  require_near_reference: false
  tolerance_pulses: null

command:
  max_delta_m: [0.03, 0.01, 0.03]
  max_speed_m_s: [0.05, 0.003, 0.05]

  orientation_enabled: true
  # rx/ry change the commanded tip-axis direction. rz is tool-roll and is
  # disabled for the current 5-DOF continuum body.
  max_rotation_delta_rad: [0.45, 0.45, 0.0]
  max_angular_speed_rad_s: [0.45, 0.45, 0.0]

  deadband_m: 0.0003
  smooth_alpha: 0.5
