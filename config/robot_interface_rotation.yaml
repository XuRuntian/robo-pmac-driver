# Conservative rotation-enabled interface config.
# The default robot_interface.yaml now uses the validated full 5-DOF teleop
# limits; keep this file for smaller-amplitude rotation tests.
control_hz: 50

# External command frame: +X right, +Y forward/insertion, +Z up.
# Internal IK frame remains +X right, +Y down, +Z forward/insertion.
frame:
  translation_map: xyz
  translation_signs: [1, -1, 1]
  rotation_map: xzy
  rotation_signs: [1, 1, -1]

initial_position:
  mode: capture_current
  reference_pulses: [63037980, 503187440, -141762994, 404354914, 18]
  reject_all_zero_feedback: true
  require_near_reference: false
  tolerance_pulses: null

command:
  max_delta_m: [0.03, 0.03, 0.005]
  max_speed_m_s: [0.05, 0.05, 0.0015]

  # Rotation is a neutral-tip-frame rotation vector [rx, ry, rz] in radians.
  orientation_enabled: true
  # Tool-axis roll rz is reserved but disabled by the current 5-DoF mechanism.
  max_rotation_delta_rad: [0.15, 0.15, 0.0]
  max_angular_speed_rad_s: [0.3, 0.3, 0.0]

  deadband_m: 0.0003
  smooth_alpha: 0.5
